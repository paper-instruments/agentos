[package]
name = "agentos-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native execution plane scaffold for secure-exec"
build = "build.rs"
# Large Pyodide runtime assets are staged at build time (copied from the
# in-tree assets directory during workspace builds, or downloaded from the
# release CDN when building the published crate) so the packaged crate stays
# under the registry size limit. See build.rs.
exclude = [
    "assets/pyodide/pyodide.asm.wasm",
    "assets/pyodide/pyodide.asm.js",
    "assets/pyodide/python_stdlib.zip",
    "assets/pyodide/numpy-2.2.5-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/pandas-2.3.3-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/cffi-1.17.1-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/charset_normalizer-3.4.4-py3-none-any.whl",
    "assets/pyodide/cryptography-46.0.1-cp313-abi3-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/et_xmlfile-2.0.0-py3-none-any.whl",
    "assets/pyodide/libopenssl-1.1.1w.zip",
    "assets/pyodide/lxml-6.0.2-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/openpyxl-3.1.5-py2.py3-none-any.whl",
    "assets/pyodide/pdfminer_six-20250506-py3-none-any.whl",
    "assets/pyodide/pdfplumber-0.11.7-py3-none-any.whl",
    "assets/pyodide/pillow-11.3.0-cp313-cp313-pyodide_2025_0_wasm32.whl",
    "assets/pyodide/pycparser-2.22-py3-none-any.whl",
    "assets/pyodide/pypdf-6.13.2-py3-none-any.whl",
    "assets/pyodide/python_docx-1.1.2-py3-none-any.whl",
    "assets/pyodide/python_pptx-1.0.2-py3-none-any.whl",
    "assets/pyodide/reportlab-5.0.0-py3-none-any.whl",
    "assets/pyodide/typing_extensions-4.15.0-py3-none-any.whl",
    "assets/pyodide/xlsxwriter-3.2.9-py3-none-any.whl",
]

[lib]
doctest = false

[dependencies]
agentos-bridge = { workspace = true }
agentos-runtime = { workspace = true }
agentos-v8-runtime = { workspace = true }
base64 = "0.22"
ciborium = "0.2"
getrandom = "0.2"
flume = "0.11"
nix = { version = "0.29", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
wat = "1"

[build-dependencies]
agentos-build-support = { workspace = true }
